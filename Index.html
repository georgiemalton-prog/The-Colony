<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Colony</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ea;--panel:#fff;--ink:#23261f;--mute:#656b5a;--line:#d3d9c8;--accent:#2f7d4f;--aink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16150f;--panel:#221f17;--ink:#ece9dc;--mute:#a09c88;--line:#38342a;--accent:#7fcf8f;--aink:#10210f}}
:root[data-theme="dark"]{--bg:#16150f;--panel:#221f17;--ink:#ece9dc;--mute:#a09c88;--line:#38342a;--accent:#7fcf8f;--aink:#10210f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:96px}
main{max-width:520px;margin:0 auto;padding:10px 12px}
h2,.big{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
h2{font-size:19px;margin:20px 0 8px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px;gap:8px}
.big{font-size:34px;font-weight:700;line-height:1}
.mute{color:var(--mute)}
.scene{border-radius:16px;overflow:hidden;background:#2a1d13;touch-action:manipulation}
canvas{display:block;width:100%;height:400px;touch-action:manipulation}
.pn{display:none}.pn.on{display:block}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;transition:width .2s}
.row{display:flex;justify-content:space-between;gap:10px;margin:10px 0 4px}
.card{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 0;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;touch-action:manipulation}
.card:disabled{opacity:.5;cursor:default}
.card b{display:block}.card .r{text-align:right;white-space:nowrap}
.card .own{font:700 22px "Bricolage Grotesque",system-ui,sans-serif}
.card.dig{border:2px solid var(--accent)}
.card:focus-visible,.nav button:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
.nav button{flex:1;padding:13px 0;border-radius:12px;border:0;background:var(--bg);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer}
.nav button.on{background:var(--accent);color:var(--aink)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:496px;margin:auto;background:var(--accent);color:var(--aink);padding:10px 14px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;z-index:5}
.toast.on{opacity:1}
.over{position:fixed;inset:0;background:rgba(10,6,3,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:#f3e6d2;z-index:20}
.over.on{display:flex}.over .card{max-width:340px}
.link{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;padding:10px 0;margin-top:16px}
:root{--bg:#d8e2c8;--panel:#f2f6e6;--ink:#2a2214;--mute:#6a6147;--line:#bfc9a8;--accent:#a85f14;--aink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d07;--panel:#25180e;--ink:#f3e6d2;--mute:#b39d7e;--line:#47321f;--accent:#f0a93a;--aink:#2a1704}}
:root[data-theme="dark"]{--bg:#140d07;--panel:#25180e;--ink:#f3e6d2;--mute:#b39d7e;--line:#47321f;--accent:#f0a93a;--aink:#2a1704}
h2{display:flex;align-items:center;gap:10px;letter-spacing:.02em}h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--line),transparent)}
#ants{color:var(--accent);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.scene{border:2px solid var(--line);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.card{border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .08s,box-shadow .08s}
.card:not(:disabled){border-color:var(--accent)}
.card:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.card.dig:not(:disabled){animation:rdy 1.6s ease-in-out infinite}
@keyframes rdy{50%{box-shadow:0 3px 0 rgba(0,0,0,.22),0 0 14px var(--accent)}}
@media (prefers-reduced-motion:reduce){.card.dig:not(:disabled){animation:none}}
.bar{height:12px;border-radius:8px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}
.bar i{position:relative;border-radius:8px}.bar i::after{content:"";position:absolute;inset:0;border-radius:8px;background:linear-gradient(rgba(255,255,255,.3),transparent 60%)}
.nav{background:linear-gradient(var(--panel),var(--bg));box-shadow:0 -6px 18px rgba(0,0,0,.3)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;padding:8px 0;border:1px solid var(--line);border-radius:14px}
.nav button span{font-size:20px;line-height:1.1}
.nav button.on{box-shadow:0 0 14px color-mix(in srgb,var(--accent) 55%,transparent)}
.over{background:radial-gradient(ellipse at center,rgba(60,15,10,.85),rgba(8,4,2,.95))}
</style></head>
<body><main>
<div class="top">
 <div><div class="big" id="ants">0</div><div class="mute">ants</div></div>
 <div style="text-align:right"><div class="big" style="font-size:22px" id="aps">0</div><div class="mute">food</div><button class="link" id="snd" style="margin:0;padding:4px 0">Sound on</button></div>
</div>
<div class="row" style="margin:0 0 4px"><span class="mute" id="tpl"></span></div><div class="bar" style="margin-bottom:8px"><i id="tpb" style="background:var(--accent)"></i></div>
<div class="scene" id="view"><canvas id="cv" role="img" aria-label="Your ant colony underground"></canvas></div>

<div class="pn on" id="p-nest">
 <div class="row"><b>Queen’s health</b><span id="hpt"></span></div><div class="bar"><i id="hpb" style="background:#c0452d"></i></div>
 <div class="row"><b>Next egg</b><span id="stt"></span></div><div class="bar"><i id="stb" style="background:#6fbf4a"></i></div>
 <button class="card dig" id="feed"></button>
 <p class="mute" id="hint"></p>
</div>
<div class="pn" id="p-tun"><p id="tst" style="margin:12px 0 4px"></p><p class="mute" id="tdf" style="margin:0"></p></div>
<div class="pn" id="p-col">
 <h2>Dig deeper</h2><div id="tier"></div>
 <h2>Roles</h2><div id="bl"></div>
 <h2>Upgrades</h2><div id="ul"></div>
 <h2>Royal flight</h2><p class="mute" id="prinfo" style="margin:0"></p><div id="pr"></div>
 <button class="link" id="reset">Erase everything</button>
</div>
</main>
<nav class="nav"><button data-t="nest" class="on"><span>🐜</span>Nest</button><button data-t="tun"><span>🕳️</span>Tunnel</button><button data-t="col"><span>🍄</span>Colony</button></nav>
<div class="over" id="over"><h2 style="font-size:32px;margin:0">The nest has fallen</h2><p id="overp" style="max-width:320px"></p><button class="card dig" id="again"><b>Found a new colony</b></button></div>
<div class="toast" id="toast"></div>

<script>
var $=function(i){return document.getElementById(i)};
/* ---------- data ---------- */
var B=[
 {id:'nurse',n:'Nurse ants',d:'Tend eggs. 0.025 ants/s each.',c:15,r:.025,t:0},
 {id:'forager',n:'Foragers',d:'0.1 ants/s, plus 0.15 food/s once the tunnel is open.',c:120,r:.1,t:0},
 {id:'soldier',n:'Soldiers',d:'Defend the nest. 3 damage/s each.',c:60,r:0,t:0,g:1.14},
 {id:'garden',n:'Fungus gardens',d:'1.5 ants/s each.',c:1600,r:1.5,t:1},
 {id:'brood',n:'Brood halls',d:'10 ants/s each.',c:20000,r:10,t:2},
 {id:'vault',n:'Jelly vaults',d:'55 ants/s each.',c:260000,r:55,t:3}];
var T=[{n:'Dirt hole',c:0},{n:'Burrow',c:1500},{n:'Colony',c:20000},{n:'Anthill',c:200000},{n:'Supercolony',c:1000000}];
var U=[
 {id:'mand',n:'Strong mandibles',d:'Tapping the queen lays twice as many eggs.',c:150,t:'click',m:2},
 {id:'armor',n:'Chitin armor',d:'Invaders steal 30% fewer ants.',c:400,t:'armor',m:.7},
 {id:'larvae',n:'Well-fed larvae',d:'Nurse ants work twice as fast.',c:800,t:'nurse',m:2},
 {id:'venom',n:'Venom sacs',d:'Soldiers deal double damage.',c:1200,t:'soldier',m:2},
 {id:'trails',n:'Pheromone trails',d:'Foragers work twice as fast.',c:3500,t:'forager',m:2},
 {id:'sentry',n:'Sentry ants',d:'Invaders crawl 35% slower.',c:6000,t:'slow',m:.65},
 {id:'compost',n:'Leaf compost',d:'Fungus gardens produce twice as much.',c:40000,t:'garden',m:2},
 {id:'guard',n:'Royal guard',d:'The queen takes half damage.',c:30000,t:'guard',m:.5},
 {id:'incub',n:'Warm incubators',d:'Brood halls produce twice as much.',c:500000,t:'brood',m:2},
 {id:'jelly',n:'Queen’s blessing',d:'Every ant works 50% harder.',c:2500000,t:'all',m:1.5}];
var LG=[
 {id:'swift',n:'Swift diggers',d:'Tunnels dig 50% faster per level.'},
 {id:'found',n:'Founding brood',d:'Start each colony with 3 more nurses per level.'},
 {id:'hardy',n:'Hardy eggs',d:'Soldiers deal 15% more per level.'},
 {id:'fat',n:'Rich larder',d:'Feeding the queen costs 15% less per level.'}];
function fresh(){return {a:0,tot:0,cnt:{},up:{},tier:0,dg:0,fd:0,st:1,fed:0,hp:100,wv:0,t:Date.now()}}
var S=fresh(),P={lp:0,ev:0,pk:{}},mut=false,dead=false;
function pk(i){return P.pk[i]||0}
function fmt(n){if(n<1000)return n<10&&n%1?n.toFixed(n<1?2:1):Math.floor(n).toString();
 var s=['K','M','B','T','Qa'],i=-1;while(n>=1000&&i<s.length-1){n/=1000;i++}
 return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+s[i]}
function cost(b){return Math.ceil(b.c*Math.pow(b.g||1.25,S.cnt[b.id]||0))}
function um(t){var m=1;U.forEach(function(u){if(S.up[u.id]&&u.t===t)m*=u.m});return m}
function raw(){var s=0;B.forEach(function(b){s+=(S.cnt[b.id]||0)*b.r*um(b.id)});return s*Math.pow(1.6,S.tier)*um('all')*(1+.08*P.ev)}
function aps(){return raw()*(S.st>0?1:.25)*(S.fed>0?1.5:1)}
function power(){return (1+aps()*.03)*um('click')*Math.pow(1.6,S.tier)}
function feedCost(){return Math.ceil(10*Math.pow(1.4,S.tier)*(1-.15*pk('fat')))}
function dps(){return (5+(S.cnt.soldier||0)*3*um('soldier'))*(1+.15*pk('hardy'))}
function gain(){return Math.floor(Math.sqrt(S.tot/20000))}
function add(n){S.a+=n;S.tot+=n}

/* ---------- sound and haptics ---------- */
var AC=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tn(f,d,ty,v,sl){if(mut)return;var a=au();if(!a)return;var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
 o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),t+d);
 g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function vib(p){try{if(!mut&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function seq(fs,gap,ty,v){fs.forEach(function(f,i){setTimeout(function(){tn(f,.18,ty||'triangle',v||.12)},i*gap)})}
var SFX={
 lay:function(){tn(480+Math.random()*140,.09,'triangle',.12,1.6);vib(8)},
 buy:function(){seq([660,990],70,'square',.07);vib(15)},
 feed:function(){seq([200,260,200],110,'sawtooth',.08);vib([20,40,20])},
 hit:function(){tn(130,.08,'square',.07,.5);vib(6)},
 boom:function(){tn(90,.4,'sawtooth',.2,.3);vib([40,30,60])},
 win:function(){seq([523,659,784,1047],110);vib([30,40,30,40,60])},
 alarm:function(){seq([330,247,330,247],140,'square',.07);vib([80,60,80])},
 lose:function(){tn(300,.9,'sawtooth',.15,.2);vib(300)},
 dig:function(){tn(70+Math.random()*30,.07,'square',.04,.6)}};

/* ---------- ui building ---------- */
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},3400)}
function card(par,id,fn){var b=document.createElement('button');b.className='card';b.id=id;b.onclick=fn;par.appendChild(b);return b}
B.forEach(function(b){card($('bl'),'b-'+b.id,function(){buy(b)})});
card($('tier'),'tierbtn',function(){dig()}).classList.add('dig');
U.forEach(function(u){card($('ul'),'u-'+u.id,function(){upg(u)})});
var fly=card($('pr'),'fly',function(){royal()});fly.classList.add('dig');
LG.forEach(function(l){card($('pr'),'l-'+l.id,function(){perk(l)})});
function buy(b){var c=cost(b);if(S.a<c||S.tier<b.t)return;S.a-=c;S.cnt[b.id]=(S.cnt[b.id]||0)+1;SFX.buy();sync()}
function upg(u){if(S.up[u.id]||S.a<u.c)return;S.a-=u.c;S.up[u.id]=1;SFX.buy()}
function dig(){var n=T[S.tier+1];if(!n||S.a<n.c)return;S.a-=n.c;S.tier++;SFX.win();toast('Your nest is now a '+n.n+'. Ants work 60% harder.')}
function perk(l){var lv=pk(l.id),c=(lv+1)*2;if(lv>=5||P.lp<c)return;P.lp-=c;P.pk[l.id]=lv+1;SFX.buy()}
function feed(){var c=feedCost();if(S.fd<c||dead)return;S.fd-=c;S.st=1;S.fed=20;SFX.feed();
 for(var i=0;i<8;i++)fx.push({x:QX+Math.random()*60-30,y:QY-50,vx:0,vy:20,l:.9,t:'\ud83c\udf43',f:14,g:0})}
$('feed').onclick=feed;
function newRun(lp){P.lp+=lp;P.ev+=lp;S=fresh();S.cnt.nurse=3*pk('found');foes=[];wvi={n:0};nf=0;dead=false;$('over').classList.remove('on');marchers.length=0;sync();save()}
function royal(){var g=gain();if(g<1)return;newRun(g);toast('A new queen founds a colony. Legacy +'+g+'.');SFX.win()}
$('again').onclick=function(){newRun(Math.floor(gain()/2))};
var rs=0;$('reset').onclick=function(){if(!rs){rs=1;this.textContent='Tap again to erase everything';setTimeout(function(){rs=0;$('reset').textContent='Erase everything'},3000);return}
 P={lp:0,ev:0,pk:{}};rs=0;this.textContent='Erase everything';newRun(0)};
$('snd').onclick=function(){mut=!mut;this.textContent=mut?'Sound off':'Sound on';if(!mut)SFX.buy()};
var tab='nest',camT=0;
function go(t){tab=t;['nest','tun','col'].forEach(function(x){$('p-'+x).classList.toggle('on',x===t)});
 document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
 $('view').style.display=t==='col'?'none':'';if(t!=='col'){sizeT();camT=t==='tun'?0:WH-H}tn(400,.05,'square',.05)}
document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){go(b.dataset.t)}});

function ui(){
 $('ants').textContent=fmt(S.a);$('aps').textContent=fmt(aps());
 $('hpt').textContent=Math.ceil(S.hp)+' / 100';$('hpb').style.width=Math.max(0,S.hp)+'%';
 $('stb').style.width=(S.st*100)+'%';$('stt').textContent=S.st<=0?'Starving':S.fed>0?'Well fed '+Math.ceil(S.fed)+'s':Math.ceil(S.st*80)+'s left';
 var fc=feedCost();$('feed').innerHTML='<span><b>Feed the queen</b><span class="mute">Costs '+fc+' food. Fills her up and boosts ants by 50% for 20s.</span></span><span class="r"><span class="own">'+Math.floor(S.fd)+'</span><br>food</span>';$('feed').disabled=S.fd<fc||dead;
 $('hint').textContent=S.dg<1?'Tap the queen to lay eggs. Your ants are digging toward the surface.':S.st<=0?'The queen is starving. Feed her before she weakens.':'Tap the queen to lay eggs. Foragers bring food in through the tunnel.';
 $('tst').innerHTML=S.dg<1?'Your ants are digging up toward the surface: <b>'+Math.floor(S.dg*100)+'%</b>':foes.length?'<b>Invaders in the tunnel: '+foes.length+'</b>':'The tunnel is open. Next wave soon.';
 $('tdf').textContent='Defense: '+fmt(dps())+' damage/s from '+(S.cnt.soldier||0)+' soldiers. Wave '+(S.wv+1)+' is next.';
 B.forEach(function(b){var el=$('b-'+b.id),lk=S.tier<b.t,c=cost(b);
  el.innerHTML='<span><b>'+b.n+'</b><span class="mute">'+b.d+'</span></span><span class="r"><span class="own">'+(S.cnt[b.id]||0)+'</span><br>'+(lk?'Needs '+T[b.t].n:fmt(c)+' ants')+'</span>';el.disabled=lk||S.a<c});
 var nt=T[S.tier+1],tb=$('tierbtn');
 if(nt){tb.innerHTML='<span><b>Become a '+nt.n+'</b><span class="mute">+60% ants, a new chamber, new ant types.</span></span><span class="r">'+fmt(nt.c)+' ants</span>';tb.disabled=S.a<nt.c}
 else{tb.innerHTML='<span><b>Supercolony reached</b><span class="mute">Take a royal flight to grow even stronger.</span></span>';tb.disabled=true}
 U.forEach(function(u){var el=$('u-'+u.id);if(S.up[u.id]){el.style.display='none';return}
  el.style.display='';el.innerHTML='<span><b>'+u.n+'</b><span class="mute">'+u.d+'</span></span><span class="r">'+fmt(u.c)+' ants</span>';el.disabled=S.a<u.c});
 var g=gain();$('prinfo').textContent='A new queen restarts your colony. You keep legacy points, which power up every future colony. Legacy: '+P.lp+' to spend, +'+Math.round(8*P.ev)+'% ants per second.';
 fly.innerHTML='<span><b>Royal flight</b><span class="mute">'+(g>=1?'Found a new colony and earn '+g+' legacy.':'Hatch 20K ants in one colony to earn legacy.')+'</span></span>';fly.disabled=g<1;
 LG.forEach(function(l){var el=$('l-'+l.id),lv=pk(l.id),c=(lv+1)*2;
  el.innerHTML='<span><b>'+l.n+' '+lv+'/5</b><span class="mute">'+l.d+'</span></span><span class="r">'+(lv>=5?'Maxed':c+' legacy')+'</span>';el.disabled=lv>=5||P.lp<c})}

/* ---------- world ---------- */
var cv=$('cv'),cx=cv.getContext('2d'),W=320,H=267,WH=534,K=1.1,dpr=1,cam=0,PT=[],CUM=[],LEN=0,pebs=[],marchers=[],fx=[],foes=[],wvi={n:0},nf=0,QX=160,QY=480,pulse=0,shake=0,lastP=0,dtip=0;
var PN=[[.22,.05],[.22,.13],[.75,.21],[.8,.3],[.25,.38],[.22,.5],[.75,.58],[.7,.7],[.5,.88]];
var FN=['beetle','spider','wasp'],IC=['\ud83c\udf44','\ud83e\udd5a','\ud83c\udf6f','\ud83d\udc51'],CI=[6,7,5,4];
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function sizeT(){dpr=window.devicePixelRatio||1;var cw=cv.clientWidth||320;W=cw/K;H=400/K;WH=H*2;cv.width=cw*dpr;cv.height=400*dpr;
 PT=PN.map(function(p){return [p[0]*W,p[1]*WH]});CUM=[0];LEN=0;
 for(var i=1;i<PT.length;i++){LEN+=Math.hypot(PT[i][0]-PT[i-1][0],PT[i][1]-PT[i-1][1]);CUM.push(LEN)}
 var f=PT[PT.length-1];QX=f[0];QY=f[1];
 pebs=[];for(var k=0;k<120;k++)pebs.push([Math.random()*W,24+Math.random()*WH,1+Math.random()*2.5,Math.random()]);camT=tab==='tun'?0:WH-H;cam=camT}
function at(p){p=Math.max(0,Math.min(1,p));var d=p*LEN,i=1;while(i<CUM.length-1&&CUM[i]<d)i++;var a=PT[i-1],b=PT[i],t=Math.max(0,Math.min(1,(d-CUM[i-1])/((CUM[i]-CUM[i-1])||1))),dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;
 return {x:a[0]+dx*t,y:a[1]+dy*t,nx:-dy/l,ny:dx/l,ang:Math.atan2(dy,dx)}}
function drawAnt(x,y,ang,sz,leaf,ph,kd){cx.save();cx.translate(x,y);cx.rotate(ang);
 cx.strokeStyle='#150c07';cx.lineWidth=1;cx.beginPath();
